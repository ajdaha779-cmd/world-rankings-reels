name: Instagram Reels

on:
  schedule:
    - cron: "17 0-6,11-23 * * *"  # каждый час в эфирное окно (15:00–10:59 по Баку); решает due.py
  workflow_dispatch:        # ручной запуск кнопкой Run workflow
    inputs:
      force:
        description: "Опубликовать сразу, не глядя на расписание"
        type: boolean
        default: false
      dry_run:
        description: "Только сделать ролик, не публиковать"
        type: boolean
        default: false
      mode:
        description: "main — обычный ролик, map — ролик-карта"
        default: "main"

permissions:
  contents: write
  actions: write  # 20.11: утром запускает ежедневные ролики YouTube

concurrency:
  group: instagram
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: YouTube — ролики на сегодня (раз в день, 10:00–17:00 по Баку)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          h=$(date -u +%H); today=$(TZ=America/New_York date +%F)
          next=$(python -c "import json;print(json.load(open('data/youtube_next.json'))['start'])" 2>/dev/null || echo 0)
          if [ "$h" -ge 6 ] && [ "$h" -le 13 ] && [[ ! "$next" > "$today" ]] && \
             [ -z "$(gh run list --workflow youtube-batch.yml --status in_progress --json databaseId -q '.[0].databaseId')" ] && \
             [ -z "$(gh run list --workflow youtube-batch.yml --status queued --json databaseId -q '.[0].databaseId')" ]; then
            gh workflow run youtube-batch.yml -f daily=true -f upload=true && echo "YouTube: запущены ролики на $today"
          else echo "YouTube: не сейчас (час $h UTC, следующий день $next)"; fi

      - name: YouTube — ответы на комментарии (каждый час)
        continue-on-error: true
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: |
          pip install -q certifi numpy pillow
          python yt_replies.py
          git config user.name "reels-bot"
          git config user.email "reels-bot@users.noreply.github.com"
          git add data/yt_replied.json data/yt_requests.json
          git diff --cached --quiet && exit 0
          git commit -q -m "YouTube: ответы на комментарии"
          for i in 1 2 3; do git push && exit 0; sleep $((i * 15)); git pull --rebase -q || true; done

      - name: Пора ли публиковать?
        id: due
        run: |
          if [ "${{ inputs.force }}" = "true" ] || [ "${{ inputs.dry_run }}" = "true" ]; then echo "due=true" >> "$GITHUB_OUTPUT"; echo "sleep=0" >> "$GITHUB_OUTPUT"; echo "mode=${{ inputs.mode || 'main' }}" >> "$GITHUB_OUTPUT"; echo "ручной запуск"; else python due.py; fi

      - name: Ответить зрителям (каждый час, даже без нового ролика)
        if: steps.due.outputs.due != 'true'
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: |
          pip install -q certifi numpy
          python replies.py
          git config user.name "reels-bot"
          git config user.email "reels-bot@users.noreply.github.com"
          git add data/requests.json data/fans.json
          git diff --cached --quiet && exit 0
          git commit -q -m "Ответы на комментарии"
          for i in 1 2 3; do git push && exit 0; sleep $((i * 15)); git pull --rebase -q || true; done

      - name: Случайная пауза внутри часа (время публикаций «живое»)
        if: steps.due.outputs.due == 'true'
        run: sleep ${{ steps.due.outputs.sleep }}

      - name: Модель озвучки (кэш, чтобы не скачивать каждый раз)
        if: steps.due.outputs.due == 'true'
        uses: actions/cache@v4
        with:
          path: data/tts
          key: kokoro-v1.0-int8

      - name: Установить зависимости
        if: steps.due.outputs.due == 'true'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -r requirements.txt

      - name: Сделать и опубликовать ролик
        if: steps.due.outputs.due == 'true'
        id: post
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: python cloud_post.py ${{ inputs.dry_run && '--dry-run' || '' }} --mode ${{ steps.due.outputs.mode || 'main' }}

      - name: Сохранить ролик (можно скачать для YouTube/TikTok, хранится 14 дней)
        if: always() && steps.post.outputs.video
        uses: actions/upload-artifact@v4
        with:
          name: reel-${{ github.run_number }}
          path: ${{ steps.post.outputs.video }}
          retention-days: 14

      - name: Запомнить, какие темы уже вышли
        if: success() && steps.due.outputs.due == 'true' && !inputs.dry_run
        run: |
          git config user.name "reels-bot"
          git config user.email "reels-bot@users.noreply.github.com"
          git add data/used_cloud.json data/history_cloud.json data/requests.json data/cup.json data/fans.json "data/АНАЛИЗ.md"
          git diff --cached --quiet || git commit -m "Опубликован ролик #${{ github.run_number }}"
          # GitHub иногда отвечает «fatal error» — повторяем, иначе ролик забудется и может выйти повторно
          for i in 1 2 3 4 5; do git push && exit 0; sleep $((i * 20)); git pull --rebase -q || true; done
          exit 1
