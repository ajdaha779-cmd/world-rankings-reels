name: Озвучка

# Служебный инструмент для других проектов: строки текста → WAV (английский Kokoro, русский Piper).
on:
  workflow_dispatch:
    inputs:
      lines:
        description: 'JSON: [{"id": "...", "lang": "en|ru", "text": "..."}]'
        required: true

jobs:
  narrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/cache@v4
        with:
          path: data/tts
          key: kokoro-v1.0-int8
      - run: pip install -r requirements.txt piper-tts
      - env:
          LINES: ${{ inputs.lines }}
        run: python tools/narrate.py "$LINES"
      - uses: actions/upload-artifact@v4
        with:
          name: narration
          path: work/narration/*.wav
          retention-days: 7
