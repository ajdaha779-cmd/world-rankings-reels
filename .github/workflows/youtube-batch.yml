name: YouTube batch

# Пачка роликов с озвучкой для ручной загрузки в YouTube Studio (с отложенной публикацией).
# Запуск: Actions → YouTube batch → Run workflow. Ролики — во вкладке Artifacts запуска.
on:
  workflow_dispatch:
    inputs:
      count:
        description: "Сколько роликов"
        default: "21"
      start:
        description: "Первый день публикаций ГГГГ-ММ-ДД (пусто = завтра)"
        default: ""

permissions:
  contents: write

jobs:
  batch:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      REELS_PLATFORM: youtube
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/cache@v4
        with:
          path: data/tts
          key: kokoro-v1.0-int8
      - name: Установить зависимости
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -r requirements.txt
      - name: Сделать пачку
        run: python make_batch.py --count ${{ inputs.count }} ${{ inputs.start && format('--start {0}', inputs.start) || '' }}
      - uses: actions/upload-artifact@v4
        with:
          name: youtube-batch-${{ github.run_number }}
          path: к-публикации/
          retention-days: 14
      - name: Запомнить темы
        run: |
          git config user.name "reels-bot"
          git config user.email "reels-bot@users.noreply.github.com"
          git add data/used_youtube.json
          git diff --cached --quiet && exit 0
          git commit -q -m "YouTube: пачка #${{ github.run_number }}"
          for i in 1 2 3 4 5; do git push && exit 0; sleep $((i * 20)); git pull --rebase -q || true; done
          exit 1
