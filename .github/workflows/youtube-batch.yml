name: YouTube batch

# YouTube через API (20.11: аудит не нужен). Ежедневно (daily=true): свежая статистика канала → hits.py → 3 ролика
# на сегодня (09/13/19 Нью-Йорк = 18/22/04 Баку). Запускает instagram.yml (будильник cron-job.org) утром, раз в день.
# Пачки на несколько дней вперёд НЕ делать — решение пользователя 20.11.
on:
  workflow_dispatch:
    inputs:
      count:
        description: "Сколько роликов"
        default: "21"
      start:
        description: "Первый день публикаций ГГГГ-ММ-ДД (пусто = после прошлой пачки)"
        default: ""
      upload:
        description: "Загрузить на YouTube (true/false)"
        default: "true"
      daily:
        description: "Ролики на сегодня по свежей статистике (true/false)"
        default: "true"

permissions:
  contents: write

concurrency:
  group: youtube
  cancel-in-progress: false

jobs:
  batch:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      REELS_PLATFORM: youtube
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/cache@v4
        with:
          path: data/tts
          key: kokoro-v1.0-int8
      - name: Установить зависимости
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -r requirements.txt
      - name: Сделать пачку
        run: python make_batch.py --count ${{ inputs.count || '21' }} ${{ inputs.start && format('--start {0}', inputs.start) || '' }} ${{ (inputs.upload || 'true') == 'true' && '--upload' || '' }} ${{ inputs.daily == 'true' && '--daily' || '' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: youtube-batch-${{ github.run_number }}
          path: к-публикации/
          retention-days: 14
      - name: Запомнить темы
        if: always()  # даже если часть не загрузилась — темы уже использованы
        run: |
          git config user.name "reels-bot"
          git config user.email "reels-bot@users.noreply.github.com"
          git add data/used_youtube.json data/youtube_next.json
          git diff --cached --quiet && exit 0
          git commit -q -m "YouTube: пачка #${{ github.run_number }}"
          for i in 1 2 3 4 5; do git push && exit 0; sleep $((i * 20)); git pull --rebase -q || true; done
          exit 1
